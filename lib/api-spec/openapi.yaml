openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Workspace overview
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: team
    description: Team members
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get workspace progress summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its tasks
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List tasks with optional filters
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assigneeId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
  /members:
    get:
      operationId: getMembers
      tags: [team]
      summary: List team members
      responses:
        "200":
          description: Team member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TaskStatus:
      type: string
      enum: [todo, in-progress, review, done]
    ProjectStatus:
      type: string
      enum: [active, on-hold, completed]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
    Project:
      type: object
      required: [id, name, description, color, status, dueDate, createdAt, taskCount, completedTaskCount]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        color: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        dueDate: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
        taskCount: { type: integer }
        completedTaskCount: { type: integer }
    ProjectInput:
      type: object
      required: [name, description, color, status]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        color: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        dueDate: { type: ["string", "null"], format: date }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        color: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        dueDate: { type: ["string", "null"], format: date }
    Task:
      type: object
      required: [id, projectId, title, description, status, priority, dueDate, assigneeId, createdAt, updatedAt, projectName, assigneeName]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        dueDate: { type: ["string", "null"], format: date }
        assigneeId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        projectName: { type: string }
        assigneeName: { type: ["string", "null"] }
    TaskInput:
      type: object
      required: [projectId, title, description, status, priority]
      properties:
        projectId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        dueDate: { type: ["string", "null"], format: date }
        assigneeId: { type: ["integer", "null"] }
    TaskUpdate:
      type: object
      properties:
        projectId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        dueDate: { type: ["string", "null"], format: date }
        assigneeId: { type: ["integer", "null"] }
    Member:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
    ProjectProgress:
      type: object
      required: [projectId, projectName, color, totalTasks, completedTasks, dueDate]
      properties:
        projectId: { type: integer }
        projectName: { type: string }
        color: { type: string }
        totalTasks: { type: integer }
        completedTasks: { type: integer }
        dueDate: { type: ["string", "null"], format: date }
    DashboardSummary:
      type: object
      required: [activeProjects, openTasks, completedThisWeek, overdueTasks, projectProgress, upcomingTasks]
      properties:
        activeProjects: { type: integer }
        openTasks: { type: integer }
        completedThisWeek: { type: integer }
        overdueTasks: { type: integer }
        projectProgress:
          type: array
          items: { $ref: "#/components/schemas/ProjectProgress" }
        upcomingTasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }

