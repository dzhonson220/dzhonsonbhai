kind = "web"
previewPath = "/"
title = "Team Project Tracker"
description = "A project management workspace for a small B2B SaaS startup team to organize projects, assign task owners, manage deadlines, and track progress."
version = "1.0.0"
id = "artifacts/team-project-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21056

[services.development]
run = "pnpm --filter @workspace/team-project-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/team-project-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/team-project-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21056"
BASE_PATH = "/"
